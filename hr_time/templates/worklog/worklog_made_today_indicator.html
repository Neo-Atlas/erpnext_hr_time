{% if has_worklog %}
<div class="worklog-status-alert mb-3 mt-0 success border-success" role="alert">
    <span class="mr-2 mb-0 h3 text-success">&check;</span>
    {{ _("Worklog has already been entered for today.") }}
</div>
{% else %}
<div class="worklog-status-alert mb-3 mt-0 danger border-danger" role="alert">
    <span class="mr-2 mb-0 h3 text-danger">&cross;</span>
    {{ _("No worklog entered for today.") }}
</div>
{% endif %}
